name: CI Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-py314.txt -r requirements.txt -r requirements-pyqt.txt pytest

      - name: Run regression gates
        run: |
          python -m pytest tests/platform/test_runtime_enforcement.py tests/platform/test_cli_first_boundaries.py tests/platform/test_license_service.py tests/platform/test_licensing_integration.py tests/platform/test_settings_governance_enforcement.py tests/platform/test_database_evolution.py tests/platform/test_core_database_migrations.py tests/platform/test_database_migration_gate.py tests/platform/test_golive_gate.py tests/modules/test_usermanagement_persistence.py tests/modules/usermanagement/test_postgres_schema_static.py tests/modules/usermanagement/test_postgres_migration_gate.py tests/modules/test_registry_module.py tests/modules/test_migration_gates_documents.py tests/modules/test_incident_management_boundary.py tests/e2e_cli/test_startup_and_guards.py tests/e2e_cli/test_database_commands.py tests/e2e_cli/test_users_and_settings_cli.py tests/interfaces/test_architecture_gates.py tests/interfaces/test_pyqt_navigation_smoke.py -q

      - name: Run database migration foundation gate
        run: |
          python scripts/database_migration_gate.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}" --output build/database-migration-gate-output.json

      - name: Prepare migration-gate fixture db
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import sqlite3
          from pathlib import Path

          from modules.documents.module import DOCUMENTS_DATABASE_CONTRIBUTION
          from qm_platform.persistence import (
              DataValidationQuery,
              DatabaseEvolutionService,
              DatabaseSpec,
              MigrationStep,
          )

          path = Path("build") / "ci-documents.db"
          path.parent.mkdir(parents=True, exist_ok=True)
          contribution = DOCUMENTS_DATABASE_CONTRIBUTION
          spec = DatabaseSpec(
              database_id=contribution.database_id,
              path=path,
              migrations=tuple(
                  MigrationStep(item.version, item.name, item.sql_path)
                  for item in contribution.migrations
              ),
              validation_queries=tuple(
                  DataValidationQuery(item.name, item.sql)
                  for item in contribution.validation_queries
              ),
          )
          DatabaseEvolutionService(app_home=Path("build")).migrate(
              (spec,),
              reason="ci_documents_fixture",
          )

          with sqlite3.connect(path) as connection:
              connection.execute(
                  """
                  INSERT INTO document_headers (
                      document_id, doc_type, control_class, workflow_profile_id,
                      register_binding, created_at, updated_at
                  ) VALUES (?, ?, ?, ?, ?, datetime('now'), datetime('now'))
                  """,
                  ("DOC-CI-1", "VA", "CONTROLLED", "long_release", 1),
              )
              connection.execute(
                  """
                  INSERT INTO document_versions (
                      document_id, version, title, description, doc_type,
                      control_class, workflow_profile_id, owner_user_id, status,
                      workflow_active, workflow_profile_json, editors_json,
                      reviewers_json, approvers_json, reviewed_by_json,
                      approved_by_json, edit_signature_done, valid_from,
                      valid_until, next_review_at, review_completed_at,
                      review_completed_by, approval_completed_at,
                      approval_completed_by, released_at, archived_at,
                      archived_by, superseded_by_version, extension_count,
                      custom_fields_json, last_event_id, last_event_at,
                      last_actor_user_id, updated_at
                  ) VALUES (
                      ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,
                      ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, datetime('now')
                  )
                  """,
                  (
                      "DOC-CI-1", 1, "CI Title", None, "VA", "CONTROLLED",
                      "long_release", "admin", "PLANNED", 0, "{}", "[]", "[]",
                      "[]", "[]", "[]", 0, None, None, None, None, None, None,
                      None, None, None, None, None, 0, "{}", None, None, None,
                  ),
              )

      - name: Run migration gate script
        run: |
          python scripts/migration_gates_documents.py --documents-db-path build/ci-documents.db --profiles-path modules/documents/workflow_profiles.json --baseline-other-count 0 > build/migration-gate-output.json

      - name: Run go-live gate script
        run: |
          python scripts/golive_gate.py --output build/golive-gate-output.json

      - name: Upload gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-gate-output
          path: |
            build/migration-gate-output.json
            build/database-migration-gate-output.json
            build/golive-gate-output.json

  postgres-usermanagement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qmtool
          POSTGRES_PASSWORD: qmtool
          POSTGRES_DB: qmtool_um
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qmtool -d qmtool_um"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Linux job must not install Windows-only requirements (pywin32).
          python -m pip install -c constraints-py314.txt "psycopg[binary]>=3.2.0" pytest

      - name: Run PostgreSQL migration gate
        run: |
          python scripts/postgres_migration_gate.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}" --output build/postgres-migration-gate-output.json

      - name: Run Usermanagement PostgreSQL live tests
        env:
          QMTOOL_PG_DSN: postgresql://qmtool:qmtool@localhost:5432/qmtool_um
          QMTOOL_PG_REQUIRED: "1"
          PYTHONPATH: .
        run: |
          python -m pytest tests/modules/usermanagement/test_postgres_schema_static.py tests/modules/usermanagement/test_postgres_migration_gate.py -q
          python -m pytest tests/modules/usermanagement/test_postgres_schema_live.py -m postgres -q
          python -m pytest tests/modules/usermanagement/test_postgres_repositories_live.py -m postgres -q

      - name: Upload PostgreSQL gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-gate-output
          path: build/postgres-migration-gate-output.json
