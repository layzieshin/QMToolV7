[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -q --basetemp=build/pytest-basetemp
markers =
    postgres: live tests against the isolated PG16 destructive cluster (QMTOOL_PG_TEST_* env); not runtime/lab QMTOOL_PG_DSN
    j04_final_acceptance: full J04-M0 real-process acceptance gate (requires QMTOOL_J04_FINAL_ACCEPTANCE opt-in)
